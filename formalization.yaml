# formalization.yaml (v0.4): repo-root metadata for this formalization,
# following https://github.com/mathlib-initiative/formalization.yaml

version: "v0.4"

project:
  name: "cm-globalization"
  description: >-
    Lean 4 / Mathlib formalization of the globalization of a finite extension L/ℚ_p to a CM number
    field with a specified p-adic completion: the polynomial-approximation / Krasner step producing a number
    field F with a place v such that F_v ≃ L, archimedean signatures by weak approximation, and passage to a
    CM extension in which p has the desired splitting behaviour (Topics in Absolute Anabelian Geometry III,
    Appendix, CM1).
    Complete: CmGlobalization.exists_cmField_globalization proves that every finite extension L of ℚ_p
    contains a CM number field F whose maximal real subfield F⁺ is dense in L with ℚ_p ⊗ F⁺ ≅ L, and whose
    place above p splits in F/F⁺; the completion is expressed by a dense embedding F ↪ L.
    CmGlobalization.exists_cmField_globalization' restates this with Mathlib's HeightOneSpectrum /
    FinitePlace / adicCompletion: two distinct places w₁ ≠ w₂ of F over a place v₀ of F⁺, whose absolute
    values are equivalent to the norms induced by the embeddings, with all three adic completions isomorphic
    to L as topological fields.
  authors:
    - "Claude (Anthropic)"
    - "LANA Project"
  responsible_maintainers:
    - "Christian Merten"
  license: "Apache-2.0"

sources:
  - title: "Krasner's lemma and weak approximation"
    type: "textbook material"
    note: "As in standard algebraic-number-theory texts. Krasner's lemma is replaced by the inverse function theorem plus openness of primitive elements; weak approximation for ℚ at {p, ∞} is done by hand."
  - title: "Complex Multiplication"
    authors: ["Serge Lang"]
    type: "book"
    note: "Background reference (README, Established sources)."

related_formalizations:
  - id: "https://github.com/lana-agents/iut"
    relationship: "other"
    note: "Intended as an input to the anabelian machinery of iut; not used by it."

classification:
  arxiv: ["math.NT"]
  msc2020: ["11R21", "11S20", "11G15"]

status:
  scope: "complete (CM globalization of finite extensions of ℚ_p, with dense embeddings and with Mathlib's places and adic completions)"
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - name: "CmGlobalization.exists_cmField_globalization"
      file: "CmGlobalization/Main.lean"
      note: >-
        F ⊆ L CM number field; F⁺ dense in L, spans L over ℚ_p, [F⁺ : ℚ] = [L : ℚ_p]; √-(8p-1) ∈ F ∩ ℚ_p and the
        inclusion and its conjugate twist are not related by a ℚ_p-automorphism of L (the place splits in F/F⁺).
    - name: "CmGlobalization.exists_cmField_globalization'"
      file: "CmGlobalization/MainPlaces.lean"
      note: >-
        For L normed over ℚ_p: w₁ ≠ w₂ : HeightOneSpectrum (𝓞 F) over v₀ : HeightOneSpectrum (𝓞 F⁺); ‖ι x‖, ‖ι (c x)‖,
        ‖ι y‖ are positive powers of the FinitePlace absolute values; w₁.adicCompletion F, w₂.adicCompletion F and
        v₀.adicCompletion F⁺ are ring-isomorphic and homeomorphic to L, extending ι, ι ∘ c, ι|F⁺.
    - name: "CmGlobalization.exists_adicCompletion_ringEquiv"
      file: "CmGlobalization/Places.lean"
      note: >-
        For a number field F and a dense ι : F →+* L into a complete ultrametric normed field, the place
        place ι = {a ∈ 𝓞 F | ‖ι a‖ < 1} has adicCompletion ≃+* L (homeomorphism extending ι); isEquiv_place
        compares FinitePlace.mk (place ι) with x ↦ ‖ι x‖.
    - name: "CmGlobalization.exists_isCMField_denseRange"
      file: "CmGlobalization/Main.lean"
      note: "A CM number field F : Type u with a ring embedding F →+* L of dense range."
    - name: "CmGlobalization.exists_generator_root_real"
      file: "CmGlobalization/Approximation.lean"
      note: "Primitive element of L/ℚ_p that is a root of a rational polynomial of degree [L : ℚ_p] with only real roots."
    - name: "CmGlobalization.eventually_exists_root"
      file: "CmGlobalization/RootNearby.lean"
      note: "Simple roots persist under perturbation of the coefficients (inverse function theorem)."

automation:
  methods:
    - method: "agent"
      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        orchestra for running the agents, taxis for project management, and Claude (Claude Code) as the
        coding agent; Lean/Lake builds with `lake build --wfail`.
      prompting_notes: >-
        Human input consisted of high-level task descriptions and scope decisions.
  notes: >-
    Agents were run with orchestra; project management (issues, status) was done in taxis;
    Claude was the coding agent.

fidelity:
  divergences: >-
    In exists_cmField_globalization, F_v ≃ L is stated as an embedding F ↪ L with dense image (L complete);
    exists_cmField_globalization' states it with Mathlib's HeightOneSpectrum / FinitePlace / adicCompletion
    (for L with a norm extending the p-adic norm; absolute values agree up to a positive power, completions are
    ring isomorphisms + homeomorphisms rather than ℚ_p-algebra isomorphisms, as adicCompletion F carries no
    ℚ_p-algebra structure in Mathlib). The splitting of the place is stated as: γ = √-(8p-1) ∈ F ∩ ℚ_p and
    no ℚ_p-automorphism of L intertwines the inclusion with its twist by complex conjugation.

review:
  status: "agent-reviewed"
  reviewers: ["Claude (Anthropic)"]
  notes: >-
    The formalization has only been reviewed by Claude; it has not been reviewed by a human.
    Statements were checked against AbsTopIII Appendix (CM1) by Claude only.

acknowledgements: "Built on Mathlib (Apache-2.0)."
